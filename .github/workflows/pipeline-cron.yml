name: News Pipeline (24/7 cron)

on:
  schedule:
    # Every 30 minutes (offset from :00/:30 to reduce GitHub schedule drops)
    - cron: "7,37 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [run-pipeline]

permissions:
  contents: read

concurrency:
  group: veridianwire-pipeline
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-daemon.txt

      - name: Run one pipeline cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          DAEMON_INTERVAL_MINUTES: "30"
        run: python scripts/run_one_cycle.py
